<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Product Details | Zoya Nexus</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar"><div class="container topbar-inner"><span>Technology that moves your business forward</span><div><a href="index.html#contact">Contact Us</a><span class="top-sep">|</span><a href="index.html#quote">Request a Quote</a></div></div></div><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">Z</span><span class="brand-name">ZOYA <b>NEXUS</b><small>IT PRODUCTS & SOLUTIONS</small></span></a><nav class="main-nav"><a href="index.html">Home</a><a class="active" href="products.html">Products</a><a href="index.html#solutions">Solutions</a><a href="about.html">About Us</a><a href="index.html#contact">Contact</a><a class="nav-cta" href="index.html#quote">Get a Quote ↗</a></nav></div></header><main class="section"><div class="container" id="productDetail"><p>Loading product...</p></div></main><footer class="footer"><div class="container footer-bottom"><span>© <span id="year"></span> Zoya Nexus. All rights reserved.</span><a href="products.html">Back to products</a></div></footer><script src="data/products.js"></script><script src="assets/app.js"></script><script>const p=(window.ZOYA_PRODUCTS||[]).find(x=>x.id===new URLSearchParams(location.search).get('id'));const el=document.getElementById('productDetail');if(p){document.title=p.name+' | Zoya Nexus';el.innerHTML=`<div class="breadcrumbs"><a href="index.html">Home</a> / <a href="products.html">Products</a> / ${p.name}</div><div class="detail-layout"><div class="detail-image"><img src="${p.image}" alt="${p.name}"></div><div class="detail-copy"><div class="eyebrow dark"><i></i> ${p.tag}</div><span class="product-category">${p.category}</span><h1>${p.name}</h1><p>${p.description}</p><h3>Product highlights</h3><ul>${p.specs.map(s=>`<li>${s}</li>`).join('')}</ul><a class="btn btn-primary" href="index.html#quote">Request a Quote <span>→</span></a><p class="form-note">Specifications and availability can vary by model. Contact our team for details.</p></div></div>`;}else{el.innerHTML='<h1>Product not found</h1><p>Return to the product catalogue to explore available products.</p><a class="btn btn-primary" href="products.html">View Products →</a>';}</script></main></body></html>
